name: Build firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install platformio
          pio run

      - name: Create merged images
        run: |
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)
          ESPTOOL=~/.platformio/packages/tool-esptoolpy/esptool.py
          python $ESPTOOL --chip esp32 merge_bin -o firmware-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 .pio/build/cyd/bootloader.bin \
            0x8000 .pio/build/cyd/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 .pio/build/cyd/firmware.bin
          python $ESPTOOL --chip esp32s3 merge_bin -o firmware-esp32-4848s040-merged.bin \
            --flash_mode keep --flash_freq keep --flash_size 16MB \
            0x0 .pio/build/esp32-4848s040/bootloader.bin \
            0x8000 .pio/build/esp32-4848s040/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 .pio/build/esp32-4848s040/firmware.bin
          # App-only image for updates from the device's web page.
          cp .pio/build/esp32-4848s040/firmware.bin firmware-esp32-4848s040-update.bin

      - uses: actions/upload-artifact@v5
        with:
          name: firmware-merged
          path: |
            firmware-merged.bin
            firmware-esp32-4848s040-merged.bin
            firmware-esp32-4848s040-update.bin

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-merged.bin
            firmware-esp32-4848s040-merged.bin
            firmware-esp32-4848s040-update.bin
