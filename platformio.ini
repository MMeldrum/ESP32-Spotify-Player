[platformio]
default_envs = cyd, esp32-4848s040

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    lvgl/lvgl@~8.4.0
    bodmer/TJpg_Decoder@^1.1.0
    bblanchon/ArduinoJson@^7.0.0
    esp32async/ESPAsyncWebServer@^3.7.0
    esp32async/AsyncTCP@^3.3.0

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -Iinclude

; ESP32-2432S028R "Cheap Yellow Display": 320x240 ILI9341, XPT2046 resistive touch.
[env:cyd]
board = esp32dev
board_build.partitions = huge_app.csv

lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

build_flags =
    ${env.build_flags}
    -DBOARD_CYD=1
    -DFONT_UI_22=0
    -DFONT_UI_30=0
    -DFONT_CLOCK_120=0
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTOUCH_CS=33
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000

; Guition ESP32-4848S040: ESP32-S3 (16 MB flash, 8 MB OPI PSRAM), 4.0" 480x480 ST7701S RGB panel, GT911 capacitive touch.
[env:esp32-4848s040]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@1.4.9

build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_4848S040=1
    -DFONT_UI_14=0
    -DFONT_UI_20=0
    -DFONT_CLOCK_64=0
    -DBOARD_HAS_PSRAM

; Desktop simulator (macOS/Linux, needs SDL2: `brew install sdl2`): the real player UI from src/ui.cpp in a
; 480x480 window with fake Spotify data, for demos. Not in default_envs, so CI and `pio run` skip it.
; Run with: pio run -e simulator -t exec
[env:simulator]
platform = native
framework =
lib_deps = lvgl/lvgl@~8.4.0
build_src_filter = -<*> +<ui.cpp> +<clock_time.cpp> +<fonts/> +<../sim/src/>
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DSIMULATOR=1
    -DBOARD_ESP32_4848S040=1
    -DFONT_UI_14=0
    -DFONT_UI_20=0
    -DFONT_CLOCK_64=0
    -Iinclude
    -Isim/include
    -Isrc
    !pkg-config --cflags --libs sdl2
